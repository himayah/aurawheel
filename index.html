<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraWheel - 美しい回転カラーホイール & ピッカー</title>
  <meta name="description" content="美しいグラデーションでゆっくりと回転するインタラクティブなカラーホイール。速度調整、回転方向の変更、クリックによるカラーコード（HEX/RGB/HSL）の取得とコピーが可能です。">
  
  <!-- SEO & Social Media Links -->
  <meta property="og:title" content="AuraWheel - 美しい回転カラーホイール & ピッカー">
  <meta property="og:description" content="美しいグラデーションでゆっくりと回転するインタラクティブなカラーホイール。">
  <meta property="og:type" content="website">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="bg-glow bg-glow-1" id="bgGlow1"></div>
  <div class="bg-glow bg-glow-2" id="bgGlow2"></div>

  <main class="app-container">
    <header class="app-header">
      <h1 class="app-title">AuraWheel</h1>
      <p class="app-subtitle">滑らかに回転する美しいカラーホイール & ピッカー</p>
    </header>

    <div class="main-content">
      <!-- Color Wheel Section -->
      <section class="wheel-section">
        <div class="wheel-wrapper" id="wheelWrapper">
          <div class="wheel-rotator" id="wheelRotator">
            <canvas id="colorWheelCanvas" width="800" height="800"></canvas>
            <div class="wheel-pointer" id="wheelPointer" style="display: none;"></div>
          </div>
        </div>
      </section>

      <!-- Control Panel Section -->
      <section class="control-panel">
        <!-- Live Color Display Card -->
        <div class="color-display-card">
          <div class="color-preview-container">
            <div class="color-preview" id="colorPreview"></div>
            <div class="color-preview-inner-shadow"></div>
          </div>
          <div class="color-values">
            <div class="value-row">
              <span class="value-label">HEX</span>
              <div class="value-copy-wrapper">
                <span class="value-text" id="hexValue">#FFFFFF</span>
                <button class="copy-btn" data-target="hexValue" aria-label="HEXをコピー">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-copy"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
              </div>
            </div>
            <div class="value-row">
              <span class="value-label">RGB</span>
              <div class="value-copy-wrapper">
                <span class="value-text" id="rgbValue">rgb(255, 255, 255)</span>
                <button class="copy-btn" data-target="rgbValue" aria-label="RGBをコピー">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-copy"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
              </div>
            </div>
            <div class="value-row">
              <span class="value-label">HSL</span>
              <div class="value-copy-wrapper">
                <span class="value-text" id="hslValue">hsl(0, 0%, 100%)</span>
                <button class="copy-btn" data-target="hslValue" aria-label="HSLをコピー">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-copy"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Controls Card -->
        <div class="controls-card">
          <!-- Play / Pause & Direction Controls -->
          <div class="control-group button-group">
            <button id="playPauseBtn" class="primary-btn" aria-label="一時停止">
              <svg id="playIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M8 5v14l11-7z"/></svg>
              <svg id="pauseIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              <span id="playPauseText">一時停止</span>
            </button>
            
            <button id="directionBtn" class="secondary-btn" aria-label="回転方向を変更">
              <svg id="cwIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-rotate-cw"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
              <svg id="ccwIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-rotate-ccw" style="display: none;"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.12-9.36L1 10"></path></svg>
              <span id="directionText">時計回り</span>
            </button>
          </div>

          <!-- Speed Slider -->
          <div class="control-group slider-group">
            <div class="slider-header">
              <label for="speedSlider">回転速度</label>
              <span id="speedValue">1.0x</span>
            </div>
            <div class="slider-container">
              <input type="range" id="speedSlider" min="0" max="5" step="0.1" value="1">
            </div>
          </div>

          <!-- Visual Style Options -->
          <div class="control-group style-group">
            <span class="group-title">ホイールスタイル</span>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="wheelStyle" value="smooth" checked>
                <span class="custom-radio"></span>
                スムーズ
              </label>
              <label class="radio-label">
                <input type="radio" name="wheelStyle" value="segmented">
                <span class="custom-radio"></span>
                セグメント (24色)
              </label>
            </div>
          </div>
        </div>
      </section>
    </div>

    <!-- Toast Notification for copying -->
    <div class="toast" id="toast">コピーしました！</div>
  </main>

  <!-- Script -->
  <script src="app.js"></script>
</body>
</html>
